models:
  candidate_generators:
    two_tower:
      enabled: false
      phase: 5
      top_k: 300
      embedding_dim: 128
      text_projection_dim: 128
      image_projection_dim: 128
      user_id_embedding_dim: 64
      item_id_embedding_dim: 64
      tag_embedding_dim: 32
      hidden_dims: [256, 128]
      activation: gelu
      history_pooling: mean
      recency_decay: 0.9
      maximum_history_length: 50
      modality_fusion: gated
      use_text: true
      use_image: true
      use_tag: true
      use_user_id_embedding: true
      use_item_id_residual: false
      l2_normalize: true
      temperature: 0.07
      mask_false_negatives: true
      learning_rate: 0.001
      weight_decay: 0.0001
      batch_size: 256
      max_epochs: 10
      early_stopping_patience: 3
      gradient_clip_norm: 1
      evaluation_user_batch_size: 256
      seed: 42

selection:
  ablation: mean_pooling
  selected_by: two stage: ablation screen on the train->validation boundary, then confirmation across rolling folds; chosen on mean fold strict ndcg@20 with the worst fold as tie-breaker
  fit_splits: [train]
  target_split: validation
  configuration_hash: e66e40ca5f0af9016061fdc62bb152e0dfd0f9197678b36ad355737a6c05e299

dataset_identity:

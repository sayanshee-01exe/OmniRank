# ---------------------------------------------------------------------------
# Retrieval / ranking stage configuration.
#
# Phase roadmap:
#   3 popularity, matrix_factorization   4 lightgcn, sasrec   5 two_tower
#   6 ranker, reranker                   7 monitoring
#
# `enabled: false` means the *serving* pipeline does not use the generator; it
# says nothing about whether the model is implemented. Phases 3 and 4 implement
# popularity, matrix_factorization, lightgcn and sasrec as offline models;
# serving does not consume any of them until Phase 6.
#
# The values here are generic defaults. The configurations actually selected on
# validation live in `phase3_selected.yaml` and `phase4_selected.yaml`, which are
# generated from the selection records rather than hand-edited.
# ---------------------------------------------------------------------------
models:
  # Per-generator candidate budgets, merged by the aggregator (component 11).
  candidate_generators:
    popularity:
      enabled: false
      phase: 3
      top_k: 200
      # global_count | time_decay
      variant: time_decay
      # Selected on validation NDCG@20 in Phase 3. PixelRec50K training
      # interactions have a median age of 485 days and span 3,788, so short
      # half-lives collapse the ranking onto a handful of recent items; the
      # search grid was extended accordingly. See docs/models/popularity.md.
      half_life_days: 365
    matrix_factorization:
      enabled: false
      phase: 3
      top_k: 200
      implementation: bpr
      embedding_dim: 64
      learning_rate: 0.005
      regularization: 0.0001
      batch_size: 4096
      epochs: 20
      negatives_per_positive: 1
      # Users scored per batch during full-catalogue retrieval. Bounds peak
      # memory at batch_size x catalogue_size floats, never users x items.
      evaluation_user_batch_size: 512
    lightgcn:
      enabled: false
      phase: 4
      top_k: 300
      embedding_dim: 64
      # 0 disables propagation entirely, which degenerates to matrix
      # factorization. Kept reachable because it is the ablation that shows
      # whether the graph is doing the work.
      num_layers: 3
    two_tower:
      enabled: false
      phase: 5
      top_k: 300
      embedding_dim: 128
    sasrec:
      enabled: false
      phase: 4
      top_k: 200
      embedding_dim: 64
      num_blocks: 2
      num_heads: 2
      # Padding is the item id one past the last real item, so it can never
      # collide with a catalogue entry. Derived, not configured.
      maximum_sequence_length: 50

  aggregation:
    # weighted_round_robin | reciprocal_rank_fusion | normalized_score_union
    strategy: weighted_round_robin
    max_candidates: 1000
    # Damping constant for reciprocal_rank_fusion. Smaller values sharpen the
    # advantage of a source's top ranks.
    rrf_constant: 60.0
    # Normalisation for normalized_score_union: min_max | z_score |
    # rank_percentile. Score-based fusion across generators whose scores are a
    # decayed count and a dot product is only meaningful after normalising.
    normalization: rank_percentile
    # Each source is asked for this multiple of k before fusion, so the output
    # still fills k when the sources overlap heavily.
    over_retrieval_factor: 3
    # Source priority when the same item arrives from several generators; the
    # merged candidate keeps every contributing source in `sources`.
    # two_tower is absent because it is not implemented until Phase 5; a weight
    # for a generator that cannot run would silently do nothing.
    source_weights:
      sasrec: 1.0
      lightgcn: 0.9
      matrix_factorization: 0.5
      popularity: 0.2

  ranker:
    enabled: false
    phase: 6
    implementation: lightgbm         # lightgbm | catboost  (see ADR-008)
    objective: lambdarank
    num_leaves: 63
    learning_rate: 0.05
    n_estimators: 500

  reranker:
    enabled: false
    phase: 6
    strategy: mmr
    # 1.0 = pure relevance, 0.0 = pure diversity.
    lambda_relevance: 0.7

  index:
    backend: faiss                   # faiss now, pgvector/qdrant later (ADR-004)
    metric: inner_product            # inner_product | l2
    # Bumped whenever the index build procedure changes in a way that makes an
    # old index unreadable/incomparable. Enforced against artifact metadata.
    index_version: 1

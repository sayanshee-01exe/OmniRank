# ---------------------------------------------------------------------------
# Retrieval / ranking stage configuration.
#
# Phase roadmap:
#   3 popularity, matrix_factorization   4 lightgcn, sasrec   5 two_tower
#   6 ranker, reranker                   7 monitoring
#
# `enabled: false` means the *serving* pipeline does not use the generator; it
# says nothing about whether the model is implemented. Phase 3 implements
# popularity and matrix_factorization as offline baselines, and serving does not
# consume them until Phase 6.
# ---------------------------------------------------------------------------
models:
  # Per-generator candidate budgets, merged by the aggregator (component 11).
  candidate_generators:
    popularity:
      enabled: false
      phase: 3
      top_k: 200
      # global_count | time_decay
      variant: time_decay
      # Selected on validation NDCG@20 in Phase 3. PixelRec50K training
      # interactions have a median age of 485 days and span 3,788, so short
      # half-lives collapse the ranking onto a handful of recent items; the
      # search grid was extended accordingly. See docs/models/popularity.md.
      half_life_days: 365
    matrix_factorization:
      enabled: false
      phase: 3
      top_k: 200
      implementation: bpr
      embedding_dim: 64
      learning_rate: 0.005
      regularization: 0.0001
      batch_size: 4096
      epochs: 20
      negatives_per_positive: 1
      # Users scored per batch during full-catalogue retrieval. Bounds peak
      # memory at batch_size x catalogue_size floats, never users x items.
      evaluation_user_batch_size: 512
    lightgcn:
      enabled: false
      phase: 4
      top_k: 300
      embedding_dim: 64
      num_layers: 3
    two_tower:
      enabled: false
      phase: 5
      top_k: 300
      embedding_dim: 128
    sasrec:
      enabled: false
      phase: 4
      top_k: 200
      embedding_dim: 64
      num_blocks: 2
      num_heads: 2

  aggregation:
    strategy: weighted_round_robin   # weighted_round_robin | score_union
    max_candidates: 1000
    # Source priority when the same item arrives from several generators; the
    # merged candidate keeps every contributing source in `sources`.
    source_weights:
      sasrec: 1.0
      lightgcn: 0.9
      two_tower: 0.8
      matrix_factorization: 0.5
      popularity: 0.2

  ranker:
    enabled: false
    phase: 6
    implementation: lightgbm         # lightgbm | catboost  (see ADR-008)
    objective: lambdarank
    num_leaves: 63
    learning_rate: 0.05
    n_estimators: 500

  reranker:
    enabled: false
    phase: 6
    strategy: mmr
    # 1.0 = pure relevance, 0.0 = pure diversity.
    lambda_relevance: 0.7

  index:
    backend: faiss                   # faiss now, pgvector/qdrant later (ADR-004)
    metric: inner_product            # inner_product | l2
    # Bumped whenever the index build procedure changes in a way that makes an
    # old index unreadable/incomparable. Enforced against artifact metadata.
    index_version: 1

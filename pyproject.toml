[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnirank"
version = "0.1.0"
description = "OmniRank - a domain-agnostic, multi-stage, multimodal recommendation system."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Sayan" }]
keywords = ["recommender-systems", "ranking", "retrieval", "multimodal"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]

# Phase 1 runtime dependencies only.
# Everything heavy (torch, faiss, lightgbm, sentence-transformers, mlflow, dvc,
# postgres/redis drivers) lives in an optional extra so that `pip install -e .`
# and the whole test suite stay fast, CPU-only and offline.
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "structlog>=24.1,<26",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Tabular/array work for the Phase 2 data pipeline.
data = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16.0",
]
# Phase 3 baselines. Deliberately narrow: BPR needs torch and nothing else, and
# forcing CI to install sentence-transformers, faiss and mlflow just to test a
# matrix factorization would make the model job slow enough that people stop
# running it. `ml` includes this, so nothing that depended on `ml` breaks.
baseline = [
  "omnirank[data]",
  "torch>=2.3",
]
# Phase 4 retrieval: graph and sequential models plus the vector index. FAISS is
# the only addition over `baseline` - LightGCN and SASRec are written in torch
# directly rather than pulling in PyTorch Geometric or RecBole, so there is no
# second model framework to keep in sync.
retrieval = [
  "omnirank[baseline]",
  "faiss-cpu>=1.8",
]
# Full modelling stack for Phase 5+. Never imported at package import time.
ml = [
  "omnirank[retrieval]",
  "sentence-transformers>=3.0",
  "lightgbm>=4.3",
  "scikit-learn>=1.5",
  "mlflow>=2.14",
  "dvc>=3.51",
]
# Phase 2+ stateful backing services.
serving = [
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "redis>=5.0,<7",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "types-PyYAML>=6.0",
  # Required for mypy --strict over the Phase 2 data pipeline.
  "pandas-stubs>=2.2",
]

[project.scripts]
omnirank-serve = "scripts.serve:main"

[project.urls]
Documentation = "./docs/architecture/system_architecture.md"

[tool.hatch.build.targets.wheel]
packages = ["src/omnirank"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "C4",   # comprehensions
  "UP",   # pyupgrade
  "ANN",  # missing annotations
  "S",    # bandit
  "T20",  # flake8-print - no print() in library code
  "RET",  # return simplification
  "SIM",  # simplify
  "PTH",  # prefer pathlib
  "RUF",
]
ignore = [
  "ANN401",  # allow `Any` in explicitly generic contract signatures
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use fixtures without annotations, and hardcode sample values.
# S105/S106: the redaction tests must pass literal fake secrets to prove they are masked.
# S603: subprocess calls in the smoke tests use a fixed argv with no user input.
# S104: a test asserts on the "0.0.0.0" string; nothing binds to it.
# S311: tests use `random` to generate fixtures, never for cryptography.
"tests/**" = [
  "S101", "S104", "S105", "S106", "S311", "S603",
  "ANN001", "ANN201", "ANN202",
]
# CLI entrypoints are the one place where writing to stdout is the interface.
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["omnirank"]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_reexport = false
plugins = ["pydantic.mypy"]

# Tests are type-checked, but not held to the strict-mode annotation rules:
# pytest fixtures and parametrised cases are far more readable untyped, and the
# value of strict typing is in the library, not in the assertions about it.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
warn_unreachable = false
# pandas-stubs types every scalar access (`.loc[r, c]`, `.iloc[0]["x"]`) as a
# 13-member union of every dtype pandas can hold, so an ordinary assertion about
# a runtime value is unverifiable by construction. These codes are disabled for
# tests only; `src` remains fully strict, which is where the value is.
disable_error_code = [
  "operator",
  "index",
  "union-attr",
  "assignment",
  "arg-type",
  "comparison-overlap",
]

# Optional `ml`/`serving` extras are not installed in the Phase 1 environment.
# They are imported lazily inside functions and guarded by try/except, so mypy
# must not fail on their absence. Remove an entry once the extra becomes
# mandatory and the stubs are available.
[[tool.mypy.overrides]]
module = [
  "torch.*",
  "faiss.*",
  "lightgbm.*",
  "sentence_transformers.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: exercises more than one component together (still offline, no GPU)",
]
filterwarnings = ["error::DeprecationWarning:omnirank.*"]

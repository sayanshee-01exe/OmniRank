name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI must never depend on a local .env or on a developer's shell.
  OMNIRANK__ENVIRONMENT: ci
  OMNIRANK__LOGGING__FORMAT: json

jobs:
  # Core job: no modelling dependencies. Proves the package, the data pipeline
  # and the API still work on a lightweight install.
  check:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # Dev + data extras only. Torch is installed by the separate baseline job:
      # pulling it here would slow every lint run, and the core package must keep
      # working without it.
      - name: Install project
        run: uv pip install --system -e ".[data,dev]"

      - name: Ruff (lint)
        run: ruff check src tests scripts

      - name: Ruff (format check)
        run: ruff format --check src tests scripts

      - name: MyPy (strict)
        run: mypy

      - name: Pytest
        run: pytest --cov=omnirank --cov-report=term-missing

      # A contract nobody can read is not a contract. This fails if the app
      # cannot produce its OpenAPI document.
      - name: OpenAPI document builds
        run: |
          python -c "
          import json
          from omnirank.api.app import create_app
          from omnirank.core.config import load_config
          spec = create_app(load_config('configs')).openapi()
          print(f'{len(spec[\"paths\"])} paths documented')
          "

      # The evaluator and popularity must work on a torch-free install, because
      # popularity is the terminal stage of the serving fallback chain.
      - name: Evaluation and popularity work without torch
        run: |
          python -c "
          import sys
          import omnirank.evaluation
          from omnirank.models.baselines import PopularityRecommender
          assert 'torch' not in sys.modules, 'torch leaked into the core import path'
          print('evaluation + popularity import cleanly without torch')
          "
          pytest tests/unit/evaluation tests/unit/models/test_popularity.py \
                 tests/unit/models/test_negative_sampling.py -q

  # Baseline-model job: the only place torch is installed.
  baselines:
    name: baseline models (torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # `baseline` is torch only - not sentence-transformers, faiss, lightgbm or
      # mlflow, none of which Phase 3 needs.
      - name: Install project with the baseline extra
        run: uv pip install --system -e ".[baseline,dev]"

      # Metric values are asserted against hand-computed numbers, so a change in
      # the evaluator that alters a reported metric fails here.
      - name: Evaluation metric tests
        run: pytest tests/unit/evaluation -q

      - name: Popularity and negative-sampling tests
        run: pytest tests/unit/models/test_popularity.py \
                    tests/unit/models/test_negative_sampling.py -q

      # Includes save/load round-trip equality: a persistence change that alters
      # recommendations fails here.
      - name: BPR tests
        run: pytest tests/unit/models/test_bpr.py -q

      # Small, deterministic, CPU-only fixture training and evaluation.
      # No PixelRec download, no GPU, no full-dataset training.
      - name: Fixture training and evaluation integration test
        run: pytest tests/integration/test_baseline_pipeline.py -q

  retrieval-models:
    name: retrieval models (torch + faiss)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # `retrieval` is `baseline` plus faiss-cpu. Still not
      # sentence-transformers, lightgbm or mlflow, none of which Phase 4 needs.
      - name: Install project with the retrieval extra
        run: uv pip install --system -e ".[retrieval,dev]"

      # The normalisation constants and layer averaging are asserted against
      # hand-computed values, so a propagation change that alters the graph
      # maths fails here rather than showing up as a quietly worse model.
      - name: LightGCN tests
        run: pytest tests/unit/models/test_lightgcn.py -q

      # Causality is the assertion that matters: a future-leaking transformer
      # trains faster and scores better on every offline metric, so nothing
      # else in this suite would catch it.
      - name: SASRec tests
        run: pytest tests/unit/models/test_sasrec.py -q

      # Fused scores are checked against hand arithmetic, and ordering is
      # checked to be independent of source insertion order. Retrieval output
      # becomes ranker training data in Phase 6; a non-deterministic ordering
      # would make every downstream experiment irreproducible.
      - name: Aggregation and diagnostics tests
        run: pytest tests/unit/retrieval/test_aggregation.py \
                    tests/unit/retrieval/test_blended.py \
                    tests/unit/retrieval/test_diagnostics.py \
                    tests/unit/retrieval/test_runner.py -q

      # Flat indexes are checked against exact brute force in both set and
      # order. This also guards the OpenMP coexistence workaround in
      # `_require_faiss`: silent numerical corruption is precisely what these
      # tests fail on.
      - name: FAISS index tests
        run: pytest tests/unit/retrieval/test_faiss_index.py -q

      # Offset 1 is the official test target and must never enter a selection
      # fold. That failure is invisible at runtime, so it is asserted.
      - name: Rolling temporal validation tests
        run: pytest tests/unit/data/test_rolling.py -q

      # The generated model configs are derived from selection records that live
      # under the gitignored `reports/metrics/`. The tracked provenance files are
      # the only copy CI can see, so this is what makes the drift gate real
      # rather than a claim in a docstring.
      - name: Selection provenance is tracked and well-formed
        run: |
          python scripts/record_selection_provenance.py --phase 3 --check
          python scripts/record_selection_provenance.py --phase 4 --check

      # Small, deterministic, CPU-only fixture training through the full
      # retrieval path. No PixelRec download, no GPU, no full-dataset training.
      - name: Fixture retrieval integration test
        run: pytest tests/integration/test_retrieval_pipeline.py -q

  multimodal-retrieval:
    name: multimodal two-tower retrieval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # `retrieval` already carries torch and faiss-cpu, which is everything the
      # two-tower path needs. Training on published vectors requires no text or
      # image encoder, so no sentence-transformers and no image libraries.
      - name: Install project with the retrieval extra
        run: uv pip install --system -e ".[retrieval,dev]"

      # Padding must not collide with a real item, histories must precede their
      # targets, and a batch's shapes must match the feature manifest.
      - name: Two-tower dataset and tower tests
        run: pytest tests/unit/models/two_tower/test_dataset.py \
                    tests/unit/models/two_tower/test_towers.py -q

      # In-batch softmax treats other rows' targets as negatives, and some of
      # them are items the user already liked. The masking is what stops the
      # loss training against known positives.
      - name: Contrastive loss and training tests
        run: pytest tests/unit/models/two_tower/test_training.py -q

      # Identity travels with the weights: a model paired with the wrong mapping
      # or feature store returns confident recommendations for the wrong items.
      - name: Persistence and identity tests
        run: pytest tests/unit/models/two_tower/test_persistence.py -q

      # The retrieval surface, the catalogue, and the cold-item guarantee: an
      # index whose catalogue quietly contained no cold items would still answer
      # every query.
      - name: Retriever, catalogue and embedding export tests
        run: pytest tests/unit/models/two_tower/test_generator.py -q

      # Exact FAISS must reproduce brute force in set and order. An index built
      # with the wrong metric still returns k plausible neighbours.
      - name: Two-tower FAISS exactness tests
        run: pytest tests/unit/retrieval/test_two_tower_index.py -q

      # The mandatory cold-item workflow: a target no collaborative model can
      # reach, retrieved from content through a real index.
      - name: Cold-item and five-source fusion integration
        run: pytest tests/integration/test_two_tower_training.py \
                    tests/integration/test_phase5_retrieval.py -q

      # Invoked directly, not through a pipe: `python ... | tee` reports tee's
      # exit status, so a failing validator would look like a passing job.
      - name: Phase 5 completion gate
        run: python scripts/validate_phase5.py --ci
